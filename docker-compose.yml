services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chronos_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=CHRONOS-WS
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./chronos_ws.db
      - LLM_PROVIDER=RULE_BASED
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - backend_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chronos_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
