<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABHEDYA-NET | Defense-in-Depth Security Matrix</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('abhedya_theme') || localStorage.getItem('chronos_theme');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.className = theme;
        } catch(e) {
          document.documentElement.className = 'light';
        }
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-orange-500/30 selection:text-orange-900 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
